name: CI and Release

on:
  push:
    branches: [master]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}"
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  verify:
    name: Verify frontend and release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check release version
        if: github.ref_type == 'tag'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r '.version' package.json)"
          tauri="$(jq -r '.version' src-tauri/tauri.conf.json)"
          cargo="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml)"
          if [[ "$tag" != "$pkg" || "$tag" != "$tauri" || "$tag" != "$cargo" ]]; then
            echo "::error::v$tag must match package.json ($pkg), tauri.conf.json ($tauri) and Cargo.toml ($cargo)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

  android:
    name: Build and sign Android ARM64 APK
    needs: verify
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    env:
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: android-actions/setup-android@v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools platforms;android-36 build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }} ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Set NDK path
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build unsigned release APK
        run: npm run tauri -- android build --ci --apk --target aarch64 --split-per-abi

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS || 'bilibili-streamer' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_STORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_STORE_PASSWORD in Actions secrets."
            exit 1
          fi

          shopt -s nullglob
          apks=(src-tauri/gen/android/app/build/outputs/apk/arm64/release/*.apk)
          if (( ${#apks[@]} != 1 )); then
            echo "::error::Expected one Android ARM64 release APK."
            exit 1
          fi

          tools="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          temp="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -f -- "$temp/release.p12" "$temp/aligned.apk"; rmdir -- "$temp"' EXIT
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$temp/release.p12"
          unset ANDROID_KEYSTORE_BASE64
          export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_STORE_PASSWORD}"

          version="$(jq -r '.version' package.json)"
          mkdir -p release-artifacts
          output="release-artifacts/Bilibili-Streamer_${version}_android-arm64.apk"
          "$tools/zipalign" -f -P 16 4 "${apks[0]}" "$temp/aligned.apk"
          "$tools/apksigner" sign --ks "$temp/release.p12" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$output" "$temp/aligned.apk"
          "$tools/apksigner" verify --verbose --print-certs "$output"
          "$tools/zipalign" -c -P 16 4 "$output"

      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64
          path: release-artifacts/*.apk
          if-no-files-found: error

  desktop:
    name: Release desktop on ${{ matrix.platform }}
    needs: verify
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bilibili-Streamer ${{ github.ref_name }}'
          releaseBody: |
            ## Downloads

            - Android (ARM64) — signed `.apk`
            - macOS (Intel and Apple Silicon) — `.dmg`
            - Windows — `.msi` or `.exe` installer
            - Linux — `.AppImage`

            > **Windows users:** SmartScreen may prompt you to confirm installation.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  publish:
    name: Publish release
    needs: [android, desktop]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-arm64
          path: release-artifacts

      - name: Upload Android APK and publish draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          draft="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "::error::Expected a draft release for $GITHUB_REF_NAME."
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release-artifacts/*.apk
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
